<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Marketplace Agrícola - Aipe</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; border-left: 5px solid #28a745; }
        h1 { color: #2e7d32; }
    </style>
</head>
<body>
    <h1>Productos de Aipe, Huila</h1>
    <div id="productos" class="grid">
        </div>

    <script>
    async function cargarProductos() {
        try {
            // Conexión real al servidor Node.js
            const respuesta = await fetch('http://localhost:3000/api/productos');
            const productos = await respuesta.json();
            
            const contenedor = document.getElementById('productos');
            contenedor.innerHTML = ''; // Limpiar
            
            productos.forEach(p => {
                contenedor.innerHTML += `
                    <div class="card">
                        <h3>${p.nombre}</h3>
                        <p>Categoría: ${p.categoria}</p>
                        <p class="price">$${p.precio} / ${p.unidad}</p>
                        <small>Ubicación: ${p.ubicacion}</small>
                        <button class="btn">Contactar Agricultor</button>
                    </div>
                `;
            });
        } catch (error) {
            console.error("Error conectando al backend:", error);
        }
    }
    cargarProductos();
</script>
</body>
</html>
